<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />

  <title>ResQNet — Disaster Management</title>

  <!-- Tailwind CSS -->
  <script src="https://cdn.tailwindcss.com"></script>

  <script>
    tailwind.config = {
      theme: {
        extend: {
          colors: {
            ink: "#063F35",
            forest: "#06483D",
            mint: "#00D9A5",
            paper: "#F3F6F2",
            coral: "#E84A5F",
            amber: "#F2B84B"
          },

          fontFamily: {
            sans: [
              "Inter",
              "ui-sans-serif",
              "system-ui",
              "sans-serif"
            ]
          },

          boxShadow: {
            soft: "0 10px 30px rgba(6,63,53,.08)",
            glow: "0 12px 35px rgba(0,217,165,.20)"
          }
        }
      }
    }
  </script>

  <!-- Lucide Icons -->
  <script src="https://unpkg.com/lucide@latest"></script>

  <!-- Leaflet Map -->
  <link
    rel="stylesheet"
    href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"
  />

  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>

  <!-- Custom CSS -->
  <link rel="stylesheet" href="styles.css" />
</head>

<body class="bg-paper text-ink antialiased">

  <!-- Application -->
  <div id="app"></div>

  <!-- Toast notifications -->
  <div
    id="toast"
    class="fixed left-1/2 bottom-6 z-[1000] hidden
           -translate-x-1/2 rounded-full
           bg-ink px-5 py-3
           text-sm font-semibold text-white
           shadow-soft">
  </div>

  <!-- JavaScript -->
  <script src="indexeddb/indexedDB.js"></script>
  <script src="app.js"></script>
  
</body>
</html>
